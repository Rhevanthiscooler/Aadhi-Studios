<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account — Aadhi Studios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
    /* ── TOKENS (matches main.html so this page feels like part of the app) ── */
    :root {
        --ink:      #0f0f0f;
        --ink-2:    #3a3a3a;
        --ink-3:    #767676;
        --ink-4:    #b0b0b0;
        --surface:  #ffffff;
        --surface-2:#f6f6f4;
        --surface-3:#eeede9;
        --accent:   #3b3bd4;
        --accent-h: #2828b8;
        --accent-bg:#eeeeff;
        --danger:   #d93025;
        --radius:   10px;
        --nav-h:    60px;
    }
    [data-theme="dark"] {
        --ink:#f0f0f0; --ink-2:#c0c0c0; --ink-3:#888; --ink-4:#555;
        --surface:#111113; --surface-2:#18181b; --surface-3:#222226; --accent-bg:#1a1a40;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:var(--surface-2);color:var(--ink);min-height:100vh;font-size:15px;line-height:1.6;}

    @keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

    .nav{position:sticky;top:0;z-index:200;background:var(--surface);border-bottom:1px solid var(--surface-3);height:var(--nav-h);display:flex;align-items:center;padding:0 32px;gap:16px;}
    .nav-logo{font-family:'Playfair Display',serif;font-weight:700;font-size:19px;letter-spacing:.2px;}
    .nav-spacer{flex:1;}
    .nav-back{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--ink-2);font-family:'Inter',sans-serif;font-size:14px;font-weight:500;cursor:pointer;padding:8px 12px;border-radius:8px;transition:background .12s;}
    .nav-back:hover{background:var(--surface-2);}

    .page-wrap{max-width:460px;margin:0 auto;padding:48px 24px 80px;animation:screenIn .4s cubic-bezier(.16,1,.3,1);}

    .account-card{background:var(--surface);border:1px solid var(--surface-3);border-radius:16px;padding:32px 28px;}

    .account-avatar{
        width:72px;height:72px;border-radius:50%;
        background:linear-gradient(135deg,var(--accent),var(--accent-h));
        color:#fff;font-family:'Playfair Display',serif;font-size:28px;font-weight:700;
        display:flex;align-items:center;justify-content:center;
        overflow:hidden;
    }
    .account-avatar img{width:100%;height:100%;object-fit:cover;}
    .account-avatar-wrap{position:relative;width:72px;margin:0 auto 16px;}
    .avatar-edit-btn{
        position:absolute;bottom:-2px;right:-2px;width:26px;height:26px;border-radius:50%;
        background:var(--accent);color:#fff;border:2px solid var(--surface);cursor:pointer;
        display:flex;align-items:center;justify-content:center;font-size:11px;
        transition:background .12s,transform .15s ease;
    }
    .avatar-edit-btn:hover{background:var(--accent-h);transform:scale(1.08);}
    .avatar-picker-row{display:flex;flex-direction:column;gap:10px;}
    .avatar-picker-option{
        display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:10px;
        border:1px solid var(--surface-3);background:var(--surface-2);color:var(--ink);
        font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;
        transition:background .12s,border-color .12s;
    }
    .avatar-picker-option:hover{background:var(--surface-3);border-color:var(--accent);}
    .avatar-picker-option i{color:var(--accent);font-size:16px;width:18px;text-align:center;}
    .account-name{font-size:19px;font-weight:600;text-align:center;color:var(--ink);font-family:'Playfair Display',serif;}
    .account-email{font-size:13.5px;color:var(--ink-3);text-align:center;margin-top:4px;margin-bottom:26px;}

    .account-row{
        display:flex;align-items:center;justify-content:space-between;
        padding:13px 0;border-top:1px solid var(--surface-3);font-size:14px;
    }
    .account-row span:first-child{color:var(--ink-3);}
    .account-row span:last-child{color:var(--ink);font-weight:500;text-align:right;}

    .account-stats{display:flex;gap:12px;margin:22px 0 6px;}
    .account-stat-card{
        flex:1;background:var(--surface-2);border-radius:var(--radius);
        padding:16px 10px;text-align:center;
    }
    .account-stat-card .num{font-size:24px;font-weight:700;color:var(--accent);font-family:'Playfair Display',serif;line-height:1.2;}
    .account-stat-card .lbl{font-size:11.5px;color:var(--ink-3);margin-top:4px;}

    .account-signout-btn{
        width:100%;margin-top:24px;padding:12px;border-radius:var(--radius);
        border:1px solid var(--surface-3);background:none;color:var(--danger);
        font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;
        display:flex;align-items:center;justify-content:center;gap:8px;
        transition:background .12s;
    }
    .account-signout-btn:hover{background:var(--surface-2);}

    .account-security{display:flex;gap:10px;margin-top:22px;}
    .account-security-btn{
        flex:1;padding:11px;border-radius:var(--radius);
        border:1px solid var(--surface-3);background:none;color:var(--ink-2);
        font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;
        display:flex;align-items:center;justify-content:center;gap:7px;
        transition:background .12s;
    }
    .account-security-btn:hover{background:var(--surface-2);}

    .account-bio-block{margin-top:22px;padding-top:18px;border-top:1px solid var(--surface-3);}
    .account-bio-label{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--ink-3);font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:.3px;}
    .account-bio-edit-btn{background:none;border:none;color:var(--accent);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;text-transform:none;letter-spacing:0;}
    .account-bio-edit-btn:hover{text-decoration:underline;}
    .account-bio-text{font-size:14px;color:var(--ink-2);line-height:1.6;white-space:pre-wrap;word-wrap:break-word;}
    .account-bio-placeholder{color:var(--ink-4);font-style:italic;}
    .account-bio-textarea{
        width:100%;min-height:80px;padding:10px 12px;border-radius:8px;border:1px solid var(--surface-3);
        background:var(--surface-2);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;resize:vertical;
    }
    .account-bio-textarea:focus{outline:none;border-color:var(--accent);}
    .account-bio-actions{display:flex;align-items:center;gap:10px;margin-top:8px;}
    .account-bio-count{font-size:11.5px;color:var(--ink-4);margin-right:auto;}
    .account-bio-cancel-btn,.account-bio-save-btn{
        padding:7px 14px;border-radius:8px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;
    }
    .account-bio-cancel-btn{background:none;border:1px solid var(--surface-3);color:var(--ink-2);}
    .account-bio-cancel-btn:hover{background:var(--surface-2);}
    .account-bio-save-btn{background:var(--accent);border:none;color:#fff;}
    .account-bio-save-btn:hover{background:var(--accent-h);}
    .account-bio-save-btn:disabled{opacity:.6;cursor:not-allowed;}

    /* ── Modals (change password / change email) ── */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:500;opacity:0;pointer-events:none;transition:opacity .22s ease;}
    .modal-overlay.open{opacity:1;pointer-events:auto;}
    .modal-box{background:var(--surface);border-radius:16px;padding:32px;width:380px;max-width:calc(100vw - 32px);box-shadow:0 16px 48px rgba(0,0,0,.18);position:relative;}
    .modal-close{position:absolute;top:16px;right:16px;background:var(--surface-2);border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;color:var(--ink-3);display:flex;align-items:center;justify-content:center;transition:background .12s,transform .15s ease;}
    .modal-close:hover{background:var(--surface-3);transform:rotate(90deg);}
    .modal-heading{font-size:18px;font-weight:600;margin-bottom:18px;}
    .modal-field{margin-bottom:14px;}
    .modal-field label{display:block;font-size:12.5px;color:var(--ink-3);margin-bottom:6px;font-weight:600;}
    .modal-field input{
        width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--surface-3);
        background:var(--surface-2);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;
    }
    .modal-field input:focus{outline:none;border-color:var(--accent);}
    .modal-error{font-size:12.5px;color:var(--danger);margin:-4px 0 12px;min-height:1px;}
    .modal-hint{font-size:12.5px;color:var(--ink-3);margin:-4px 0 14px;line-height:1.5;}
    .modal-submit-btn{
        width:100%;padding:11px;border-radius:var(--radius);border:none;
        background:var(--accent);color:#fff;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;
        cursor:pointer;transition:background .12s;
    }
    .modal-submit-btn:hover{background:var(--accent-h);}
    .modal-submit-btn:disabled{opacity:.6;cursor:not-allowed;}

    /* ── Reader search ── */
    .user-search-bar{display:flex;gap:8px;}
    .user-search-bar input{
        flex:1;padding:10px 12px;border-radius:8px;border:1px solid var(--surface-3);
        background:var(--surface-2);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;
    }
    .user-search-bar input:focus{outline:none;border-color:var(--accent);}
    .user-search-bar button{
        width:42px;border-radius:8px;border:none;background:var(--accent);color:#fff;
        cursor:pointer;transition:background .12s;
    }
    .user-search-bar button:hover{background:var(--accent-h);}

    .search-result-row{
        display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-top:1px solid var(--surface-3);
    }
    .search-result-avatar{
        width:38px;height:38px;flex-shrink:0;border-radius:50%;
        background:linear-gradient(135deg,var(--accent),var(--accent-h));color:#fff;
        font-family:'Playfair Display',serif;font-size:15px;font-weight:700;
        display:flex;align-items:center;justify-content:center;
    }
    .search-result-info{flex:1;min-width:0;}
    .search-result-name{font-size:14.5px;font-weight:600;color:var(--ink);}
    .search-result-bio{font-size:13px;color:var(--ink-3);margin-top:3px;line-height:1.5;word-wrap:break-word;}
    .search-result-books{flex-shrink:0;text-align:center;padding-left:8px;}
    .search-result-books .num{font-size:16px;font-weight:700;color:var(--accent);font-family:'Playfair Display',serif;}
    .search-result-books .lbl{font-size:10px;color:var(--ink-3);}
    .user-search-note{text-align:center;padding:16px 0;color:var(--ink-3);font-size:13.5px;}

    /* ── Friend requests ── */
    .request-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--surface-3);}
    .request-avatar{
        width:38px;height:38px;flex-shrink:0;border-radius:50%;overflow:hidden;
        background:linear-gradient(135deg,var(--accent),var(--accent-h));color:#fff;
        font-family:'Playfair Display',serif;font-size:15px;font-weight:700;
        display:flex;align-items:center;justify-content:center;
    }
    .request-avatar img{width:100%;height:100%;object-fit:cover;}
    .request-name{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--ink);}
    .request-actions{display:flex;gap:6px;flex-shrink:0;}
    .request-btn{
        padding:7px 12px;border-radius:8px;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
        cursor:pointer;border:1px solid var(--surface-3);background:none;transition:background .12s;
    }
    .request-btn.accept{background:var(--accent);color:#fff;border-color:var(--accent);}
    .request-btn.accept:hover{background:var(--accent-h);}
    .request-btn.decline{color:var(--ink-3);}
    .request-btn.decline:hover{background:var(--surface-2);}

    /* ── Friends strip ── */
    .friends-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
    .friends-header h3{font-size:14px;font-weight:600;color:var(--ink);}
    .friends-count{font-size:12px;color:var(--ink-3);}
    .friends-strip{display:flex;gap:16px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;}
    .friends-strip::-webkit-scrollbar{height:5px;}
    .friends-strip::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:4px;}
    .friend-chip{flex-shrink:0;width:66px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center;}
    .friend-chip-avatar{
        width:52px;height:52px;border-radius:50%;overflow:hidden;
        background:linear-gradient(135deg,var(--accent),var(--accent-h));color:#fff;
        font-family:'Playfair Display',serif;font-size:19px;font-weight:700;
        display:flex;align-items:center;justify-content:center;transition:transform .15s ease;
    }
    .friend-chip:hover .friend-chip-avatar{transform:scale(1.06);}
    .friend-chip-avatar img{width:100%;height:100%;object-fit:cover;}
    .friend-chip-name{font-size:11.5px;color:var(--ink-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;}
    .friends-empty-note{color:var(--ink-3);font-size:13.5px;padding:6px 0 2px;}

    /* ── Find readers CTA ── */
    .find-readers-btn{
        width:100%;margin-top:20px;padding:15px;border-radius:14px;border:none;
        background:linear-gradient(135deg,var(--accent),var(--accent-h));color:#fff;
        font-family:'Inter',sans-serif;font-size:14.5px;font-weight:600;cursor:pointer;
        display:flex;align-items:center;justify-content:center;gap:9px;
        transition:transform .15s ease,box-shadow .15s ease;box-shadow:0 6px 18px rgba(59,59,212,.25);
    }
    .find-readers-btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(59,59,212,.32);}

    .account-guest-note{font-size:14.5px;color:var(--ink-2);text-align:center;line-height:1.7;padding:20px 0;}
    .account-guest-note i{font-size:32px;color:var(--ink-4);display:block;margin-bottom:14px;}
    .account-guest-note a{color:var(--accent);text-decoration:none;font-weight:600;}
    .account-guest-note a:hover{text-decoration:underline;}

    .skeleton-line{height:12px;background:var(--surface-3);border-radius:6px;margin:8px auto;animation:pulse 1.3s ease-in-out infinite;}
    @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

    #toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);font-size:13px;font-weight:500;padding:10px 20px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .35s cubic-bezier(.34,1.56,.64,1);z-index:9999;white-space:nowrap;}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    @media(max-width:480px){
        .nav{padding:0 16px;}
        .page-wrap{padding:32px 16px 60px;}
        .account-card{padding:26px 20px;}
    }
    </style>
</head>
<body>

<nav class="nav">
    <span class="nav-logo">Aadhi Studios</span>
    <span class="nav-spacer"></span>
    <button class="nav-back" id="backBtn"><i class="fas fa-arrow-left"></i> Back to Library</button>
</nav>

<div class="page-wrap">
    <div class="account-card" id="accountCard">
        <div style="text-align:center;padding:20px 0;">
            <div class="account-avatar-wrap"><div class="account-avatar" style="background:var(--surface-3);"></div></div>
            <div class="skeleton-line" style="width:140px;"></div>
            <div class="skeleton-line" style="width:180px;"></div>
        </div>
    </div>

    <div class="account-card" id="requestsCard" style="margin-top:20px;display:none;">
        <div class="modal-heading" style="margin-bottom:6px;font-size:16px;"><i class="fas fa-user-clock" style="color:var(--accent);margin-right:6px;"></i>Friend requests</div>
        <div id="requestsList"></div>
    </div>

    <div class="account-card" id="friendsCard" style="margin-top:20px;">
        <div class="friends-header">
            <h3><i class="fas fa-user-friends" style="color:var(--accent);margin-right:6px;"></i>Friends</h3>
            <span class="friends-count" id="friendsCount"></span>
        </div>
        <div class="friends-strip" id="friendsStrip">
            <div class="friends-empty-note"><i class="fas fa-spinner fa-spin"></i></div>
        </div>
    </div>

    <button class="find-readers-btn" id="findReadersBtn"><i class="fas fa-search"></i> Searching for any reader?</button>
</div>

<div id="toast"></div>

<!-- Change password: step 1 asks for current password, step 2 (only shown
     once that's verified) asks for the new one. -->
<div class="modal-overlay" id="passwordModal">
    <div class="modal-box">
        <button class="modal-close" data-close="passwordModal">×</button>
        <div class="modal-heading"><i class="fas fa-key" style="color:var(--accent);margin-right:8px;"></i>Change password</div>
        <div id="passwordModalBody"></div>
    </div>
</div>

<!-- Change email: same current-password check first, then a textbox for
     the new address. Firebase sends a verification link to that new
     address — the email only actually changes once they click it. -->
<div class="modal-overlay" id="emailModal">
    <div class="modal-box">
        <button class="modal-close" data-close="emailModal">×</button>
        <div class="modal-heading"><i class="fas fa-envelope" style="color:var(--accent);margin-right:8px;"></i>Change email</div>
        <div id="emailModalBody"></div>
    </div>
</div>

<!-- Change photo: pick "take a photo" (opens the device camera on mobile)
     or "choose from gallery". Both routes just feed a file into the same
     Cloudinary upload + photoURL save. -->
<div class="modal-overlay" id="avatarModal">
    <div class="modal-box">
        <button class="modal-close" data-close="avatarModal">×</button>
        <div class="modal-heading"><i class="fas fa-camera" style="color:var(--accent);margin-right:8px;"></i>Change photo</div>
        <div class="avatar-picker-row">
            <div class="avatar-picker-option" id="takePhotoOption"><i class="fas fa-camera"></i> Take a photo</div>
            <div class="avatar-picker-option" id="choosePhotoOption"><i class="fas fa-images"></i> Choose from gallery</div>
        </div>
        <div class="modal-error" id="avatarError" style="margin-top:12px;"></div>
    </div>
</div>
<input type="file" id="avatarCameraInput" accept="image/*" capture="user" style="display:none;">
<input type="file" id="avatarGalleryInput" accept="image/*" style="display:none;">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged, EmailAuthProvider, reauthenticateWithCredential, updatePassword, verifyBeforeUpdateEmail } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
import { getFirestore, collection, doc, query, where, getDocs, getDoc, updateDoc, setDoc, deleteDoc, addDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const app  = initializeApp({
    apiKey:"AIzaSyAXYitOp20kOucSlG1p1F6NUsuTz4kfGlc",
    authDomain:"aadhi-studios.firebaseapp.com",
    projectId:"aadhi-studios",
    storageBucket:"aadhi-studios.firebasestorage.app",
    messagingSenderId:"1052163368305",
    appId:"1:1052163368305:web:c8c51c39c271659caa42d0"
});
const auth = getAuth(app);
const db   = getFirestore(app);

const $ = id => document.getElementById(id);

/* ── CLOUDINARY (same free hosting the app already uses for chapter/ad files) ── */
const CLOUDINARY_CLOUD_NAME = 'dfmidzcom';
const CLOUDINARY_UPLOAD_PRESET = 'aadhi_chapters';

function escapeHtml(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function avatarInner(photoURL, name){
    const initial = (name||'?').trim().charAt(0).toUpperCase() || '?';
    return photoURL ? `<img src="${escapeHtml(photoURL)}" alt="">` : initial;
}

function toast(msg){
    const t=$('toast');
    t.textContent=msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2200);
}

const urlParams = new URLSearchParams(location.search);
const viewUid = urlParams.get('uid');

$('backBtn').addEventListener('click',()=>{
    if(viewUid){ (document.referrer && document.referrer.includes(location.host)) ? history.back() : window.location.href='account.html'; }
    else window.location.href='main.html';
});
if(viewUid) $('backBtn').innerHTML = '<i class="fas fa-arrow-left"></i> Back';
$('findReadersBtn').addEventListener('click',()=>{ window.location.href='chat.html'; });

let myUid = null, myUsername = 'Reader', myUserDocRef = null;

onAuthStateChanged(auth, async user => {
    const card = $('accountCard');
    $('requestsCard').style.display = 'none';
    $('friendsCard').style.display = 'none';
    $('findReadersBtn').style.display = 'none';

    if(!user){
        card.innerHTML = `
            <div class="account-guest-note">
                <i class="fas fa-user"></i>
                You're browsing as a guest.<br>
                <a href="index.html">Sign in</a> to see your account details.
            </div>`;
        return;
    }

    myUid = user.uid;

    if(viewUid && viewUid !== myUid){
        return renderOtherProfile(viewUid);
    }

    // 1) Basic profile from the 'users' collection
    let username='Reader', dob='—', createdAt=null, bio='', photoURL='', friends=[];
    try{

/* ══ VIEWING SOMEONE ELSE'S PROFILE (?uid=...) ══
   Reuses the same #accountCard and #friendsCard the self-view uses, just
   filled in with read-only info plus relationship actions instead of the
   editable bio/security/friends-of-mine controls. */
async function renderOtherProfile(targetUid){
    const card = $('accountCard');
    card.innerHTML = `<div style="text-align:center;padding:40px 0;"><i class="fas fa-spinner fa-spin" style="color:var(--ink-3);"></i></div>`;

    let target = null, targetDocRef = null;
    try{
        const snap = await getDocs(query(collection(db,'users'), where('uid','==',targetUid)));
        if(!snap.empty){ target = snap.docs[0].data(); targetDocRef = snap.docs[0].ref; }
    }catch{ /* fall through to not-found */ }

    if(!target){
        card.innerHTML = `<div class="account-guest-note"><i class="fas fa-user-slash"></i>This reader could not be found.</div>`;
        return;
    }

    let myFriends=[], myBlocked=[];
    try{
        const meSnap = await getDocs(query(collection(db,'users'), where('uid','==',myUid)));
        if(!meSnap.empty){
            const meData = meSnap.docs[0].data();
            myUsername = meData.username || myUsername;
            myUserDocRef = meSnap.docs[0].ref;
            myFriends = meData.friends || [];
            myBlocked = meData.blocked || [];
        }
    }catch{ /* keep defaults */ }

    const targetBlocked = target.blocked || [];
    const targetFriends = target.friends || [];
    const theyBlockedMe = targetBlocked.includes(myUid);
    const iBlockedThem  = myBlocked.includes(targetUid);
    const areFriends    = myFriends.includes(targetUid);
    const username = target.username || 'Reader';
    const bio = target.bio || '';
    const photoURL = target.photoURL || '';

    if(theyBlockedMe){
        card.innerHTML = `
            <div class="account-avatar-wrap"><div class="account-avatar">${avatarInner('', username)}</div></div>
            <div class="account-name">${escapeHtml(username)}</div>
            <div class="account-email">This reader's profile isn't available to you.</div>`;
        return;
    }

    let commentCount = 0, booksRead = 0;
    try{
        const cSnap = await getDocs(query(collection(db,'comments'), where('username','==',username)));
        commentCount = cSnap.size;
    }catch{ /* leave at 0 */ }
    try{
        const rSnap = await getDocs(query(collection(db,'readingLog'), where('uid','==',targetUid)));
        booksRead = rSnap.size;
    }catch{ /* leave at 0 */ }

    card.innerHTML = `
        <div class="account-avatar-wrap"><div class="account-avatar">${avatarInner(photoURL, username)}</div></div>
        <div class="account-name">${escapeHtml(username)}</div>

        <div class="account-stats">
            <div class="account-stat-card"><div class="num">${booksRead}</div><div class="lbl">Books read</div></div>
            <div class="account-stat-card"><div class="num">${commentCount}</div><div class="lbl">Comments posted</div></div>
        </div>

        <div class="account-bio-block">
            <div class="account-bio-label">Bio</div>
            <div class="account-bio-text">${bio ? escapeHtml(bio) : '<span class="account-bio-placeholder">No bio yet.</span>'}</div>
        </div>

        <div class="profile-actions" id="profileActions"></div>
    `;

    function renderActions(html){ $('profileActions').innerHTML = html; }

    async function blockUser(){
        if(!confirm(`Block ${username}? They won't be able to message or friend-request you.`)) return;
        try{
            await updateDoc(myUserDocRef, { blocked: arrayUnion(targetUid), friends: arrayRemove(targetUid) });
            if(targetDocRef) await updateDoc(targetDocRef, { friends: arrayRemove(myUid) });
            toast(`${username} has been blocked.`);
            renderOtherProfile(targetUid);
        }catch{ toast('Could not block that reader. Please try again.'); }
    }

    if(iBlockedThem){
        renderActions(`<button class="profile-action-btn" id="unblockBtn"><i class="fas fa-user-check"></i> Unblock</button>`);
        $('unblockBtn').addEventListener('click', async ()=>{
            await updateDoc(myUserDocRef, { blocked: arrayRemove(targetUid) });
            toast(`${username} has been unblocked.`);
            renderOtherProfile(targetUid);
        });
    } else if(areFriends){
        renderActions(`
            <button class="profile-action-btn primary" id="messageBtn"><i class="fas fa-comment-dots"></i> Message</button>
            <button class="profile-action-btn" id="unfriendBtn"><i class="fas fa-user-minus"></i> Unfriend</button>
            <button class="profile-action-btn danger" id="blockBtn"><i class="fas fa-ban"></i> Block</button>`);
        $('messageBtn').addEventListener('click', ()=>{ window.location.href = `chat.html?uid=${encodeURIComponent(targetUid)}`; });
        $('unfriendBtn').addEventListener('click', async ()=>{
            await updateDoc(myUserDocRef, { friends: arrayRemove(targetUid) });
            if(targetDocRef) await updateDoc(targetDocRef, { friends: arrayRemove(myUid) });
            toast(`You unfriended ${username}.`);
            renderOtherProfile(targetUid);
        });
        $('blockBtn').addEventListener('click', blockUser);
    } else {
        let pendingId=null, pendingDirection=null;
        try{
            const sentSnap = await getDocs(query(collection(db,'friendRequests'), where('fromUid','==',myUid), where('toUid','==',targetUid), where('status','==','pending')));
            if(!sentSnap.empty){ pendingId=sentSnap.docs[0].id; pendingDirection='sent'; }
            else{
                const recvSnap = await getDocs(query(collection(db,'friendRequests'), where('fromUid','==',targetUid), where('toUid','==',myUid), where('status','==','pending')));
                if(!recvSnap.empty){ pendingId=recvSnap.docs[0].id; pendingDirection='received'; }
            }
        }catch{ /* treat as no pending request */ }

        if(pendingDirection==='sent'){
            renderActions(`
                <button class="profile-action-btn" disabled><i class="fas fa-clock"></i> Request sent</button>
                <button class="profile-action-btn danger" id="blockBtn"><i class="fas fa-ban"></i> Block</button>`);
            $('blockBtn').addEventListener('click', blockUser);
        } else if(pendingDirection==='received'){
            renderActions(`
                <button class="profile-action-btn primary" id="acceptBtn"><i class="fas fa-check"></i> Accept</button>
                <button class="profile-action-btn" id="declineBtn"><i class="fas fa-times"></i> Decline</button>`);
            $('acceptBtn').addEventListener('click', async ()=>{
                await updateDoc(myUserDocRef, { friends: arrayUnion(targetUid) });
                if(targetDocRef) await updateDoc(targetDocRef, { friends: arrayUnion(myUid) });
                await deleteDoc(doc(db,'friendRequests',pendingId));
                toast(`You and ${username} are now friends.`);
                renderOtherProfile(targetUid);
            });
            $('declineBtn').addEventListener('click', async ()=>{
                await deleteDoc(doc(db,'friendRequests',pendingId));
                toast('Request declined.');
                renderOtherProfile(targetUid);
            });
        } else {
            renderActions(`
                <button class="profile-action-btn primary" id="addFriendBtn"><i class="fas fa-user-plus"></i> Add friend</button>
                <button class="profile-action-btn danger" id="blockBtn"><i class="fas fa-ban"></i> Block</button>`);
            $('addFriendBtn').addEventListener('click', async ()=>{
                const btn = $('addFriendBtn');
                btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending…';
                try{
                    await setDoc(doc(collection(db,'friendRequests')), {
                        fromUid: myUid, fromUsername: myUsername,
                        toUid: targetUid, toUsername: username,
                        status: 'pending', createdAt: Date.now()
                    });
                    toast(`Friend request sent to ${username}.`);
                    renderOtherProfile(targetUid);
                }catch{
                    toast('Could not send that request. Please try again.');
                    btn.disabled = false; btn.innerHTML = '<i class="fas fa-user-plus"></i> Add friend';
                }
            });
            $('blockBtn').addEventListener('click', blockUser);
        }
    }

    // Their friends — reuses the same friends strip markup/styles as the self-view.
    loadFriends(targetFriends);
    $('friendsCard').querySelector('.friends-header h3').innerHTML = '<i class="fas fa-user-friends" style="color:var(--accent);margin-right:6px;"></i>Friends';
}

function uploadAvatarImage(file){
    return new Promise((resolve,reject)=>{
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
        const xhr = new XMLHttpRequest();
        xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`);
        xhr.onload = ()=>{
            if(xhr.status>=200 && xhr.status<300){
                try{ resolve(JSON.parse(xhr.responseText).secure_url); }
                catch(e){ reject(e); }
            } else reject(new Error('Image upload failed'));
        };
        xhr.onerror = ()=>reject(new Error('Network error during image upload'));
        xhr.send(formData);
    });
}

async function handleAvatarFile(file){
    if(!file) return;
    if(!myUserDocRef){ $('avatarError').textContent = 'Could not find your profile record.'; return; }
    $('avatarError').textContent = '';
    const pickerOptions = document.querySelectorAll('.avatar-picker-option');
    pickerOptions.forEach(o=>o.style.opacity='.5');
    try{
        const url = await uploadAvatarImage(file);
        await updateDoc(myUserDocRef, { photoURL: url });
        $('myAvatar').innerHTML = avatarInner(url, myUsername);
        closeModal('avatarModal');
        toast('Profile photo updated.');
    }catch(err){
        $('avatarError').textContent = 'Could not upload that photo. Please try again.';
    }finally{
        pickerOptions.forEach(o=>o.style.opacity='1');
        $('avatarCameraInput').value=''; $('avatarGalleryInput').value='';
    }
}

/* ══ FRIEND REQUESTS — pending incoming requests, accept/decline ══ */
async function loadFriendRequests(){
    const reqCard = $('requestsCard'), listEl = $('requestsList');
    try{
        const snap = await getDocs(query(collection(db,'friendRequests'), where('toUid','==',myUid), where('status','==','pending')));
        if(snap.empty){ reqCard.style.display='none'; return; }
        reqCard.style.display='block';
        listEl.innerHTML = snap.docs.map(d=>{
            const r = d.data();
            return `
                <div class="request-row" data-id="${d.id}" data-from="${escapeHtml(r.fromUid)}" data-fromname="${escapeHtml(r.fromUsername||'Reader')}">
                    <div class="request-avatar">${avatarInner(r.fromPhoto, r.fromUsername)}</div>
                    <div class="request-name">${escapeHtml(r.fromUsername||'Reader')}</div>
                    <div class="request-actions">
                        <button class="request-btn accept">Accept</button>
                        <button class="request-btn decline">Decline</button>
                    </div>
                </div>`;
        }).join('');
        listEl.querySelectorAll('.request-row').forEach(row=>{
            row.querySelector('.accept').addEventListener('click', ()=> respondToRequest(row.dataset.id, row.dataset.from, row.dataset.fromname, true));
            row.querySelector('.decline').addEventListener('click', ()=> respondToRequest(row.dataset.id, row.dataset.from, row.dataset.fromname, false));
        });
    }catch{
        reqCard.style.display='none';
    }
}

async function respondToRequest(reqId, fromUid, fromUsername, accept){
    try{
        if(accept){
            await updateDoc(myUserDocRef, { friends: arrayUnion(fromUid) });
            const otherSnap = await getDocs(query(collection(db,'users'), where('uid','==',fromUid)));
            if(!otherSnap.empty) await updateDoc(otherSnap.docs[0].ref, { friends: arrayUnion(myUid) });
            toast(`You and ${fromUsername} are now friends.`);
        }else{
            toast('Request declined.');
        }
        await deleteDoc(doc(db,'friendRequests',reqId));
        loadFriendRequests();
        const snap = await getDocs(query(collection(db,'users'), where('uid','==',myUid)));
        loadFriends(!snap.empty ? (snap.docs[0].data().friends||[]) : []);
    }catch{
        toast('Something went wrong. Please try again.');
    }
}

/* ══ FRIENDS STRIP ══ */
async function loadFriends(friendUids){
    const stripEl = $('friendsStrip'), countEl = $('friendsCount'), cardEl = $('friendsCard');
    cardEl.style.display='block';
    countEl.textContent = friendUids.length ? `${friendUids.length}` : '';
    if(!friendUids.length){
        stripEl.innerHTML = `<div class="friends-empty-note">No friends yet — find readers below and send a request.</div>`;
        return;
    }
    stripEl.innerHTML = `<div class="friends-empty-note"><i class="fas fa-spinner fa-spin"></i></div>`;
    try{
        const chips = await Promise.all(friendUids.map(async fUid=>{
            try{
                const snap = await getDocs(query(collection(db,'users'), where('uid','==',fUid)));
                if(snap.empty) return '';
                const d = snap.docs[0].data();
                return `
                    <div class="friend-chip" data-uid="${escapeHtml(fUid)}">
                        <div class="friend-chip-avatar">${avatarInner(d.photoURL, d.username)}</div>
                        <div class="friend-chip-name">${escapeHtml(d.username||'Reader')}</div>
                    </div>`;
            }catch{ return ''; }
        }));
        stripEl.innerHTML = chips.join('') || `<div class="friends-empty-note">No friends yet.</div>`;
        stripEl.querySelectorAll('.friend-chip').forEach(chip=>{
            chip.addEventListener('click', ()=>{ window.location.href = `account.html?uid=${encodeURIComponent(chip.dataset.uid)}`; });
        });
    }catch{
        stripEl.innerHTML = `<div class="friends-empty-note">Could not load friends.</div>`;
    }
}

/* Turns a Firebase auth error into something a person can actually read. */
function friendlyAuthError(err){
    const code = err && err.code || '';
    if(code.includes('wrong-password') || code.includes('invalid-credential')) return 'That password is incorrect.';
    if(code.includes('too-many-requests')) return 'Too many attempts. Please wait a bit and try again.';
    if(code.includes('weak-password')) return 'Please choose a password with at least 6 characters.';
    if(code.includes('invalid-email')) return 'That doesn\'t look like a valid email address.';
    if(code.includes('email-already-in-use')) return 'That email is already in use by another account.';
    if(code.includes('requires-recent-login')) return 'Please re-enter your current password and try again.';
    if(code.includes('network-request-failed')) return 'Network error — please check your connection and try again.';
    return err && err.message ? err.message : 'Something went wrong. Please try again.';
}

function reauthenticate(currentPassword){
    const user = auth.currentUser;
    const credential = EmailAuthProvider.credential(user.email, currentPassword);
    return reauthenticateWithCredential(user, credential);
}

function renderEmailStep2(){
    $('emailModalBody').innerHTML = `
        <div class="modal-field">
            <label>New email address</label>
            <input type="email" id="emNew" autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="modal-hint">We'll send a confirmation link to this new address. Your email only changes once you click that link — your current one keeps working until then.</div>
        <div class="modal-error" id="emStep2Error"></div>
        <button class="modal-submit-btn" id="emStep2Btn">Send confirmation link</button>
    `;
    $('emNew').addEventListener('keydown', e=>{ if(e.key==='Enter') $('emStep2Btn').click(); });
    $('emStep2Btn').addEventListener('click', async ()=>{
        const newEmail = $('emNew').value.trim();
        const errEl = $('emStep2Error'), btn = $('emStep2Btn');
        if(!newEmail || !newEmail.includes('@')){ errEl.textContent='Please enter a valid email address.'; return; }
        if(newEmail.toLowerCase() === (auth.currentUser.email||'').toLowerCase()){ errEl.textContent='That\'s already your current email.'; return; }
        errEl.textContent=''; btn.disabled=true; btn.textContent='Sending…';
        try{
            await verifyBeforeUpdateEmail(auth.currentUser, newEmail);
            closeModal('emailModal');
            toast(`Confirmation link sent to ${newEmail}.`);
        }catch(err){
            errEl.textContent = friendlyAuthError(err);
            btn.disabled=false; btn.textContent='Send confirmation link';
        }
    });
}
</script>
</body>
</html>

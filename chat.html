<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages — Aadhi Studios</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
    :root {
        --ink:      #0f0f0f;
        --ink-2:    #3a3a3a;
        --ink-3:    #767676;
        --ink-4:    #b0b0b0;
        --surface:  #ffffff;
        --surface-2:#f6f6f4;
        --surface-3:#eeede9;
        --accent:   #3b3bd4;
        --accent-h: #2828b8;
        --radius:   10px;
        --nav-h:    60px;
    }
    [data-theme="dark"] {
        --ink:#f0f0f0; --ink-2:#c0c0c0; --ink-3:#888; --ink-4:#555;
        --surface:#111113; --surface-2:#18181b; --surface-3:#222226;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%;}
    body{font-family:'Inter',sans-serif;background:var(--surface-2);color:var(--ink);font-size:15px;line-height:1.5;display:flex;flex-direction:column;height:100vh;overflow:hidden;}

    @keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

    .nav{flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--surface-3);height:var(--nav-h);display:flex;align-items:center;padding:0 20px;gap:14px;}
    .nav-logo{font-family:'Playfair Display',serif;font-weight:700;font-size:18px;}
    .nav-spacer{flex:1;}
    .nav-back{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--ink-2);font-family:'Inter',sans-serif;font-size:14px;font-weight:500;cursor:pointer;padding:8px 12px;border-radius:8px;transition:background .12s;}
    .nav-back:hover{background:var(--surface-2);}

    .content{flex:1;min-height:0;max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;animation:screenIn .3s ease;}

    /* ── Tabs ── */
    .chat-tabs{flex-shrink:0;display:flex;gap:4px;padding:12px 20px 0;}
    .chat-tab{
        flex:1;padding:10px 8px;border-radius:10px 10px 0 0;border:none;background:none;
        color:var(--ink-3);font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;cursor:pointer;
        display:flex;align-items:center;justify-content:center;gap:7px;transition:background .12s,color .12s;
        border-bottom:2px solid transparent;
    }
    .chat-tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--surface);}
    .chat-tab:hover:not(.active){background:var(--surface);}

    /* ── Inbox ── */
    #inboxView{flex:1;min-height:0;overflow-y:auto;padding:16px 20px 24px;}

    /* ── Search readers ── */
    #searchView{flex:1;min-height:0;overflow-y:auto;padding:16px 20px 24px;display:none;}
    .user-search-bar{display:flex;gap:8px;margin-bottom:6px;}
    .user-search-bar input{
        flex:1;padding:10px 12px;border-radius:8px;border:1px solid var(--surface-3);
        background:var(--surface);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;
    }
    .user-search-bar input:focus{outline:none;border-color:var(--accent);}
    .user-search-bar button{
        width:42px;border-radius:8px;border:none;background:var(--accent);color:#fff;
        cursor:pointer;transition:background .12s;
    }
    .user-search-bar button:hover{background:var(--accent-h);}
    .search-result-row{display:flex;align-items:flex-start;gap:12px;padding:14px 4px;border-top:1px solid var(--surface-3);}
    .search-result-avatar{
        width:40px;height:40px;flex-shrink:0;border-radius:50%;overflow:hidden;
        background:linear-gradient(135deg,var(--accent),var(--accent-h));color:#fff;
        font-family:'Playfair Display',serif;font-size:16px;font-weight:700;
        display:flex;align-items:center;justify-content:center;cursor:pointer;
    }
    .search-result-avatar img{width:100%;height:100%;object-fit:cover;}
    .search-result-info{flex:1;min-width:0;cursor:pointer;}
    .search-result-name{font-size:14.5px;font-weight:600;color:var(--ink);}
    .search-result-bio{font-size:12.5px;color:var(--ink-3);margin-top:3px;line-height:1.5;word-wrap:break-word;}
    .search-result-actions{flex-shrink:0;display:flex;flex-direction:column;gap:6px;align-items:stretch;}
    .sr-btn{
        padding:6px 12px;border-radius:8px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;
        cursor:pointer;border:1px solid var(--surface-3);background:none;color:var(--ink-2);white-space:nowrap;transition:background .12s;
    }
    .sr-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
    .sr-btn.primary:hover{background:var(--accent-h);}
    .sr-btn:hover{background:var(--surface-2);}
    .sr-btn:disabled{opacity:.6;cursor:not-allowed;}
    .sr-btn.danger{color:var(--danger);}
    .user-search-note{text-align:center;padding:16px 0;color:var(--ink-3);font-size:13.5px;}
    .friend-locked-note{text-align:center;color:var(--ink-3);font-size:13px;padding:14px 20px;background:var(--surface);border-radius:10px;margin:8px 0 4px;line-height:1.6;}
    .inbox-empty{text-align:center;color:var(--ink-3);font-size:14px;padding:60px 20px;line-height:1.7;}
    .inbox-empty i{font-size:34px;color:var(--ink-4);display:block;margin-bottom:14px;}
    .inbox-row{
        display:flex;align-items:center;gap:12px;padding:13px 8px;border-radius:10px;cursor:pointer;
        transition:background .12s;
    }
    .inbox-row:hover{background:var(--surface);}
    .inbox-avatar{
        width:44px;height:44px;flex-shrink:0;border-radius:50%;
        background:linear-gradient(135deg,var(--accent),var(--accent-h));color:#fff;
        font-family:'Playfair Display',serif;font-size:17px;font-weight:700;
        display:flex;align-items:center;justify-content:center;overflow:hidden;
    }
    .inbox-avatar img{width:100%;height:100%;object-fit:cover;}
    .inbox-info{flex:1;min-width:0;}
    .inbox-name{font-size:14.5px;font-weight:600;color:var(--ink);}
    .inbox-preview{font-size:13px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .inbox-time{font-size:11px;color:var(--ink-4);flex-shrink:0;}

    /* ── Thread ── */
    #threadView{flex:1;min-height:0;display:none;flex-direction:column;}
    .thread-header{
        flex-shrink:0;display:flex;align-items:center;gap:12px;padding:14px 20px;
        background:var(--surface);border-bottom:1px solid var(--surface-3);
    }
    .thread-back{background:none;border:none;color:var(--ink-2);font-size:16px;cursor:pointer;padding:4px;}
    .thread-avatar{
        width:36px;height:36px;border-radius:50%;flex-shrink:0;
        background:linear-gradient(135deg,var(--accent),var(--accent-h));color:#fff;
        font-family:'Playfair Display',serif;font-size:14px;font-weight:700;
        display:flex;align-items:center;justify-content:center;overflow:hidden;
    }
    .thread-avatar img{width:100%;height:100%;object-fit:cover;}
    .thread-name{font-size:15px;font-weight:600;}

    .thread-messages{flex:1;min-height:0;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;}
    .msg-row{display:flex;}
    .msg-row.mine{justify-content:flex-end;}
    .msg-bubble{max-width:75%;padding:9px 14px;border-radius:16px;font-size:14px;line-height:1.45;word-wrap:break-word;white-space:pre-wrap;}
    .msg-row.mine .msg-bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px;}
    .msg-row.theirs .msg-bubble{background:var(--surface);color:var(--ink);border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.06);}
    .msg-time{font-size:10px;color:var(--ink-4);margin-top:3px;text-align:right;}
    .msg-row.theirs .msg-time{text-align:left;}

    .thread-input-bar{
        flex-shrink:0;display:flex;align-items:flex-end;gap:10px;padding:12px 16px;
        background:var(--surface);border-top:1px solid var(--surface-3);
    }
    .thread-input-bar textarea{
        flex:1;resize:none;max-height:100px;padding:10px 14px;border-radius:20px;
        border:1px solid var(--surface-3);background:var(--surface-2);color:var(--ink);
        font-family:'Inter',sans-serif;font-size:14px;line-height:1.4;
    }
    .thread-input-bar textarea:focus{outline:none;border-color:var(--accent);}
    .thread-send-btn{
        width:40px;height:40px;flex-shrink:0;border-radius:50%;border:none;background:var(--accent);
        color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;
        transition:background .12s;
    }
    .thread-send-btn:hover{background:var(--accent-h);}
    .thread-send-btn:disabled{opacity:.5;cursor:not-allowed;}

    .guest-note{text-align:center;color:var(--ink-2);font-size:14.5px;line-height:1.8;padding:60px 24px;}
    .guest-note a{color:var(--accent);font-weight:600;text-decoration:none;}
    .guest-note a:hover{text-decoration:underline;}

    #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);font-size:13px;font-weight:500;padding:10px 20px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .35s cubic-bezier(.34,1.56,.64,1);z-index:9999;white-space:nowrap;}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    @media(max-width:520px){
        .nav{padding:0 14px;}
        #inboxView{padding:12px 14px 20px;}
        .thread-header{padding:12px 14px;}
        .thread-messages{padding:16px 14px;}
        .thread-input-bar{padding:10px 12px;}
    }
    </style>
</head>
<body>

<nav class="nav">
    <span class="nav-logo">Aadhi Studios</span>
    <span class="nav-spacer"></span>
    <button class="nav-back" id="backBtn"><i class="fas fa-arrow-left"></i> Back to Account</button>
</nav>

<div class="content">
    <div class="chat-tabs" id="chatTabs">
        <button class="chat-tab active" id="tabMessages"><i class="fas fa-comment-dots"></i> Messages</button>
        <button class="chat-tab" id="tabSearch"><i class="fas fa-search"></i> Find readers</button>
    </div>

    <div id="inboxView">
        <div class="inbox-empty"><i class="fas fa-spinner fa-spin"></i></div>
    </div>

    <div id="searchView">
        <div class="user-search-bar">
            <input type="text" id="userSearchInput" placeholder="Search by username…">
            <button id="userSearchBtn"><i class="fas fa-search"></i></button>
        </div>
        <div class="user-search-note" id="searchHint">You can chat with friends only. Send a friend request here — once they accept, you can message them.</div>
        <div id="userSearchResults"></div>
    </div>

    <div id="threadView">
        <div class="thread-header">
            <button class="thread-back" id="threadBackBtn"><i class="fas fa-arrow-left"></i></button>
            <div class="thread-avatar" id="threadAvatar"></div>
            <div class="thread-name" id="threadName"></div>
        </div>
        <div class="thread-messages" id="threadMessages"></div>
        <div class="thread-input-bar">
            <textarea id="msgInput" rows="1" placeholder="Write a message…" maxlength="2000"></textarea>
            <button class="thread-send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
import {
    getFirestore, collection, doc, setDoc, addDoc, onSnapshot, updateDoc, deleteDoc,
    query, where, orderBy, getDocs, arrayUnion, arrayRemove
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const app = initializeApp({
    apiKey:"AIzaSyAXYitOp20kOucSlG1p1F6NUsuTz4kfGlc",
    authDomain:"aadhi-studios.firebaseapp.com",
    projectId:"aadhi-studios",
    storageBucket:"aadhi-studios.firebasestorage.app",
    messagingSenderId:"1052163368305",
    appId:"1:1052163368305:web:c8c51c39c271659caa42d0"
});
const auth = getAuth(app);
setPersistence(auth, browserLocalPersistence).catch(()=>{ /* falls back to default persistence */ });
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const urlParams = new URLSearchParams(location.search);
const openWithUid = urlParams.get('uid');

function escapeHtml(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sortedPairId(a,b){ return [a,b].sort().join('_'); }
function toast(msg){
    const t=$('toast'); t.textContent=msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2200);
}
function avatarInner(photoURL, name){
    const initial = (name||'?').trim().charAt(0).toUpperCase() || '?';
    return photoURL ? `<img src="${escapeHtml(photoURL)}" alt="">` : initial;
}
function timeAgo(ts){
    if(!ts) return '';
    const diff = Date.now() - ts;
    const min = Math.floor(diff/60000);
    if(min < 1) return 'now';
    if(min < 60) return `${min}m`;
    const hr = Math.floor(min/60);
    if(hr < 24) return `${hr}h`;
    const day = Math.floor(hr/24);
    if(day < 7) return `${day}d`;
    return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
}

$('backBtn').addEventListener('click', ()=>{ window.location.href='account.html'; });

let myUid = null, myUsername = 'Reader', myUserDocRef = null, myFriends = [], myBlocked = [];
let unsubMessages = null;
let unsubInbox = null;

$('tabMessages').addEventListener('click', ()=> switchTab('messages'));
$('tabSearch').addEventListener('click', ()=> switchTab('search'));

function switchTab(which){
    if(unsubMessages){ unsubMessages(); unsubMessages = null; }
    $('threadView').style.display = 'none';
    $('tabMessages').classList.toggle('active', which==='messages');
    $('tabSearch').classList.toggle('active', which==='search');
    $('inboxView').style.display = which==='messages' ? 'block' : 'none';
    $('searchView').style.display = which==='search' ? 'block' : 'none';
    $('chatTabs').style.display = 'flex';
    if(which==='messages') renderInbox();
}

onAuthStateChanged(auth, async user => {
    if(!user){
        $('chatTabs').style.display = 'none';
        $('searchView').style.display = 'none';
        $('inboxView').style.display = 'block';
        $('inboxView').innerHTML = `
            <div class="guest-note">
                <i class="fas fa-comment-dots" style="font-size:32px;color:var(--ink-4);display:block;margin-bottom:12px;"></i>
                You need to be signed in to use messages.<br>
                <a href="index.html">Sign in</a> to continue.
            </div>`;
        return;
    }
    myUid = user.uid;
    try{
        const snap = await getDocs(query(collection(db,'users'), where('uid','==',myUid)));
        if(!snap.empty){
            const d = snap.docs[0].data();
            myUsername = d.username || myUsername;
            myUserDocRef = snap.docs[0].ref;
            myFriends = d.friends || [];
            myBlocked = d.blocked || [];
        }
    }catch{ /* keep default */ }

    if(openWithUid){
        if(openWithUid === myUid){ window.location.href='chat.html'; return; }
        if(!myFriends.includes(openWithUid)){
            toast('You can only message friends. Send a friend request first.');
            history.replaceState(null,'','chat.html');
            switchTab('search');
            $('userSearchInput').focus();
            return;
        }
        switchTab('messages');
        openThread(openWithUid);
    } else {
        switchTab('messages');
    }
});

/* ══ INBOX — every conversation this reader is part of, newest first ══ */
function renderInbox(){
    $('threadView').style.display = 'none';
    $('inboxView').style.display = 'block';
    if(unsubMessages){ unsubMessages(); unsubMessages = null; }

    if(unsubInbox) unsubInbox();
    unsubInbox = onSnapshot(
        query(collection(db,'chats'), where('participants','array-contains',myUid)),
        async snap => {
            if(snap.empty){
                $('inboxView').innerHTML = `
                    <div class="inbox-empty">
                        <i class="fas fa-comment-dots"></i>
                        No conversations yet.<br>Visit a reader's profile and tap "Message" to start one.
                    </div>`;
                return;
            }

            const chats = snap.docs.map(d=>({ id:d.id, ...d.data() }))
                .sort((a,b)=>(b.lastMessageAt||0)-(a.lastMessageAt||0));

            const rows = await Promise.all(chats.map(async chat => {
                const otherUid = (chat.participants||[]).find(u=>u!==myUid);
                const otherName = (chat.usernames||{})[otherUid] || 'Reader';
                let photoURL = '';
                try{
                    const uSnap = await getDocs(query(collection(db,'users'), where('uid','==',otherUid)));
                    if(!uSnap.empty) photoURL = uSnap.docs[0].data().photoURL || '';
                }catch{ /* no photo */ }

                return `
                    <div class="inbox-row" data-uid="${escapeHtml(otherUid||'')}">
                        <div class="inbox-avatar">${avatarInner(photoURL, otherName)}</div>
                        <div class="inbox-info">
                            <div class="inbox-name">${escapeHtml(otherName)}</div>
                            <div class="inbox-preview">${escapeHtml(chat.lastMessage||'')}</div>
                        </div>
                        <div class="inbox-time">${timeAgo(chat.lastMessageAt)}</div>
                    </div>`;
            }));

            $('inboxView').innerHTML = rows.join('');
            $('inboxView').querySelectorAll('.inbox-row').forEach(row=>{
                row.addEventListener('click', ()=> openThread(row.dataset.uid));
            });
        },
        () => {
            $('inboxView').innerHTML = `<div class="inbox-empty">Could not load your messages. Please try again.</div>`;
        }
    );
}

/* ══ THREAD — a single open conversation, live-updating ══ */
async function openThread(otherUid){
    if(unsubInbox){ unsubInbox(); unsubInbox = null; }

    $('inboxView').style.display = 'none';
    $('searchView').style.display = 'none';
    $('threadView').style.display = 'flex';
    $('threadMessages').innerHTML = `<div style="text-align:center;color:var(--ink-3);padding:20px;"><i class="fas fa-spinner fa-spin"></i></div>`;

    let otherUsername = 'Reader', otherPhoto = '';
    try{
        const uSnap = await getDocs(query(collection(db,'users'), where('uid','==',otherUid)));
        if(!uSnap.empty){
            const d = uSnap.docs[0].data();
            otherUsername = d.username || otherUsername;
            otherPhoto = d.photoURL || '';
        }
    }catch{ /* keep defaults */ }

    $('threadName').textContent = otherUsername;
    $('threadAvatar').innerHTML = avatarInner(otherPhoto, otherUsername);

    const chatId = sortedPairId(myUid, otherUid);
    const chatRef = doc(db,'chats',chatId);

    // Make sure the chat doc exists (harmless no-op if it already does)
    try{
        await setDoc(chatRef, {
            participants:[myUid, otherUid],
            usernames:{ [myUid]:myUsername, [otherUid]:otherUsername }
        }, { merge:true });
    }catch{ /* if this fails, sending below will surface the real error */ }

    if(unsubMessages) unsubMessages();
    const messagesRef = collection(db,'chats',chatId,'messages');
    unsubMessages = onSnapshot(
        query(messagesRef, orderBy('timestamp')),
        snap => {
            const box = $('threadMessages');
            const wasNearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
            box.innerHTML = snap.docs.map(d=>{
                const m = d.data();
                const mine = m.senderUid === myUid;
                return `
                    <div class="msg-row ${mine?'mine':'theirs'}">
                        <div>
                            <div class="msg-bubble">${escapeHtml(m.text||'')}</div>
                            <div class="msg-time">${timeAgo(m.timestamp)}</div>
                        </div>
                    </div>`;
            }).join('') || `<div style="text-align:center;color:var(--ink-3);font-size:13.5px;padding:20px;">Say hello to ${escapeHtml(otherUsername)} 👋</div>`;
            if(wasNearBottom) box.scrollTop = box.scrollHeight;
        },
        () => { $('threadMessages').innerHTML = `<div style="text-align:center;color:var(--danger,#d93025);padding:20px;">Could not load messages.</div>`; }
    );

    $('threadMessages').scrollTop = $('threadMessages').scrollHeight;

    // Wire send + back (fresh listeners each time we open a thread)
    const input = $('msgInput');
    input.value = '';
    const sendBtn = $('sendBtn');

    async function send(){
        const text = input.value.trim();
        if(!text) return;
        sendBtn.disabled = true;
        try{
            await addDoc(messagesRef, { senderUid:myUid, senderUsername:myUsername, text, timestamp:Date.now() });
            await setDoc(chatRef, {
                participants:[myUid, otherUid],
                usernames:{ [myUid]:myUsername, [otherUid]:otherUsername },
                lastMessage:text, lastMessageAt:Date.now()
            }, { merge:true });
            input.value = '';
            input.style.height = 'auto';
        }catch(err){
            toast('Could not send that message. Please try again.');
        }
        sendBtn.disabled = false;
        input.focus();
    }

    sendBtn.onclick = send;
    input.oninput = ()=>{ input.style.height='auto'; input.style.height = Math.min(input.scrollHeight,100)+'px'; };
    input.onkeydown = e=>{
        if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
    };

    $('threadBackBtn').onclick = ()=>{
        if(unsubMessages){ unsubMessages(); unsubMessages=null; }
        // Reflect back at the inbox URL so refreshing doesn't reopen this thread
        history.replaceState(null,'','chat.html');
        switchTab('messages');
    };
}

/* ══ FIND READERS — search, then friend request / message / block ══
   You can only ever message a friend. Search results always get an
   Add friend + Block pair, unless a request is already pending (either
   direction) or you're already friends, in which case the buttons change. */
$('userSearchBtn').addEventListener('click', doUserSearch);
$('userSearchInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doUserSearch(); });

async function doUserSearch(){
    const term = $('userSearchInput').value.trim();
    const resultsEl = $('userSearchResults');
    if(!term){ resultsEl.innerHTML=''; return; }

    resultsEl.innerHTML = `<div class="user-search-note"><i class="fas fa-spinner fa-spin"></i></div>`;

    try{
        const snap = await getDocs(query(
            collection(db,'users'),
            where('username','>=',term),
            where('username','<=',term+'\uf8ff')
        ));

        const matches = snap.docs.map(d=>d.data()).filter(u=>u.uid && u.uid!==myUid).slice(0,20);

        if(matches.length===0){
            resultsEl.innerHTML = `<div class="user-search-note">No readers found matching "${escapeHtml(term)}".</div>`;
            return;
        }

        const rows = await Promise.all(matches.map(u => buildSearchRow(u)));
        resultsEl.innerHTML = rows.join('');
        wireSearchRowActions();
    }catch(err){
        resultsEl.innerHTML = `<div class="user-search-note" style="color:var(--danger);">Search failed. Please try again.</div>`;
    }
}

async function buildSearchRow(u){
    const bioText = u.bio ? escapeHtml(u.bio) : '<span style="font-style:italic;color:var(--ink-4);">No bio yet.</span>';
    const theyBlockedMe = (u.blocked||[]).includes(myUid);

    if(theyBlockedMe){
        return `
            <div class="search-result-row">
                <div class="search-result-avatar">${avatarInner(u.photoURL,u.username)}</div>
                <div class="search-result-info"><div class="search-result-name">${escapeHtml(u.username||'Reader')}</div>
                <div class="search-result-bio">Not available.</div></div>
            </div>`;
    }
    if(myBlocked.includes(u.uid)){
        return `
            <div class="search-result-row" data-uid="${escapeHtml(u.uid)}">
                <div class="search-result-avatar view-profile">${avatarInner(u.photoURL,u.username)}</div>
                <div class="search-result-info view-profile"><div class="search-result-name">${escapeHtml(u.username||'Reader')}</div>
                <div class="search-result-bio">${bioText}</div></div>
                <div class="search-result-actions"><button class="sr-btn unblock-btn">Unblock</button></div>
            </div>`;
    }
    if(myFriends.includes(u.uid)){
        return `
            <div class="search-result-row" data-uid="${escapeHtml(u.uid)}">
                <div class="search-result-avatar view-profile">${avatarInner(u.photoURL,u.username)}</div>
                <div class="search-result-info view-profile"><div class="search-result-name">${escapeHtml(u.username||'Reader')}</div>
                <div class="search-result-bio">${bioText}</div></div>
                <div class="search-result-actions">
                    <button class="sr-btn primary message-btn">Message</button>
                    <button class="sr-btn danger unfriend-btn">Unfriend</button>
                </div>
            </div>`;
    }

    let pendingId=null, pendingDirection=null;
    try{
        const sentSnap = await getDocs(query(collection(db,'friendRequests'), where('fromUid','==',myUid), where('toUid','==',u.uid), where('status','==','pending')));
        if(!sentSnap.empty){ pendingId=sentSnap.docs[0].id; pendingDirection='sent'; }
        else{
            const recvSnap = await getDocs(query(collection(db,'friendRequests'), where('fromUid','==',u.uid), where('toUid','==',myUid), where('status','==','pending')));
            if(!recvSnap.empty){ pendingId=recvSnap.docs[0].id; pendingDirection='received'; }
        }
    }catch{ /* treat as no pending request */ }

    let actionsHtml;
    if(pendingDirection==='sent'){
        actionsHtml = `<button class="sr-btn" disabled>Request sent</button>`;
    } else if(pendingDirection==='received'){
        actionsHtml = `
            <button class="sr-btn primary accept-btn" data-req="${pendingId}">Accept</button>
            <button class="sr-btn decline-btn" data-req="${pendingId}">Decline</button>`;
    } else {
        actionsHtml = `
            <button class="sr-btn primary addfriend-btn">Add friend</button>
            <button class="sr-btn danger block-btn">Block</button>`;
    }

    return `
        <div class="search-result-row" data-uid="${escapeHtml(u.uid)}" data-username="${escapeHtml(u.username||'Reader')}">
            <div class="search-result-avatar view-profile">${avatarInner(u.photoURL,u.username)}</div>
            <div class="search-result-info view-profile"><div class="search-result-name">${escapeHtml(u.username||'Reader')}</div>
            <div class="search-result-bio">${bioText}</div></div>
            <div class="search-result-actions">${actionsHtml}</div>
        </div>`;
}

function wireSearchRowActions(){
    document.querySelectorAll('#userSearchResults .search-result-row').forEach(row=>{
        const uid = row.dataset.uid, uname = row.dataset.username || 'Reader';
        row.querySelectorAll('.view-profile').forEach(el=>{
            el.addEventListener('click', ()=>{ if(uid) window.location.href = `account.html?uid=${encodeURIComponent(uid)}`; });
        });

        const addBtn = row.querySelector('.addfriend-btn');
        if(addBtn) addBtn.addEventListener('click', async ()=>{
            addBtn.disabled=true; addBtn.textContent='Sending…';
            try{
                await setDoc(doc(collection(db,'friendRequests')), {
                    fromUid:myUid, fromUsername:myUsername, toUid:uid, toUsername:uname,
                    status:'pending', createdAt:Date.now()
                });
                toast(`Friend request sent to ${uname}.`);
                doUserSearch();
            }catch{
                toast('Could not send that request. Please try again.');
                addBtn.disabled=false; addBtn.textContent='Add friend';
            }
        });

        const blockBtn = row.querySelector('.block-btn');
        if(blockBtn) blockBtn.addEventListener('click', async ()=>{
            if(!confirm(`Block ${uname}? They won't be able to message or friend-request you.`)) return;
            try{
                await updateDoc(myUserDocRef, { blocked: arrayUnion(uid), friends: arrayRemove(uid) });
                myBlocked.push(uid); myFriends = myFriends.filter(f=>f!==uid);
                toast(`${uname} has been blocked.`);
                doUserSearch();
            }catch{ toast('Could not block that reader. Please try again.'); }
        });

        const unblockBtn = row.querySelector('.unblock-btn');
        if(unblockBtn) unblockBtn.addEventListener('click', async ()=>{
            try{
                await updateDoc(myUserDocRef, { blocked: arrayRemove(uid) });
                myBlocked = myBlocked.filter(b=>b!==uid);
                toast(`${uname} has been unblocked.`);
                doUserSearch();
            }catch{ toast('Could not unblock that reader. Please try again.'); }
        });

        const unfriendBtn = row.querySelector('.unfriend-btn');
        if(unfriendBtn) unfriendBtn.addEventListener('click', async ()=>{
            try{
                await updateDoc(myUserDocRef, { friends: arrayRemove(uid) });
                const otherSnap = await getDocs(query(collection(db,'users'), where('uid','==',uid)));
                if(!otherSnap.empty) await updateDoc(otherSnap.docs[0].ref, { friends: arrayRemove(myUid) });
                myFriends = myFriends.filter(f=>f!==uid);
                toast(`You unfriended ${uname}.`);
                doUserSearch();
            }catch{ toast('Could not unfriend that reader. Please try again.'); }
        });

        const messageBtn = row.querySelector('.message-btn');
        if(messageBtn) messageBtn.addEventListener('click', ()=>{
            switchTab('messages');
            openThread(uid);
        });

        const acceptBtn = row.querySelector('.accept-btn');
        if(acceptBtn) acceptBtn.addEventListener('click', async ()=>{
            try{
                await updateDoc(myUserDocRef, { friends: arrayUnion(uid) });
                const otherSnap = await getDocs(query(collection(db,'users'), where('uid','==',uid)));
                if(!otherSnap.empty) await updateDoc(otherSnap.docs[0].ref, { friends: arrayUnion(myUid) });
                await deleteDoc(doc(db,'friendRequests',acceptBtn.dataset.req));
                myFriends.push(uid);
                toast(`You and ${uname} are now friends.`);
                doUserSearch();
            }catch{ toast('Something went wrong. Please try again.'); }
        });

        const declineBtn = row.querySelector('.decline-btn');
        if(declineBtn) declineBtn.addEventListener('click', async ()=>{
            try{
                await deleteDoc(doc(db,'friendRequests',declineBtn.dataset.req));
                toast('Request declined.');
                doUserSearch();
            }catch{ toast('Something went wrong. Please try again.'); }
        });
    });
}
</script>
</body>
</html>
